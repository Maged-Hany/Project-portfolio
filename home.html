        console.log("Hello Maged");
        function toggleNav() {
            var header = document.querySelector('.header-container');

        function playMusic() {
            var audio = document.getElementById("music");
            if (audio.paused) {
                audio.play();
                document.getElementById("musicBtn").innerHTML = '<i class="fas fa-pause"></i> Pause Music';
            } else {
                audio.pause();
                document.getElementById("musicBtn").innerHTML = '<i class="fas fa-play"></i> Play Music';
            }
        }
    </script>
    <script src="portfolio.js"></script>
    
    <video autoplay muted loop id="bg-video">
        <source src="pages/88481-606110665.mp4" type="video/mp4">

    </audio>
    
    
    <div class="header-container">
