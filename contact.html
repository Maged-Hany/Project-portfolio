<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Maged</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="contact-page">
    <script>
        function toggleNav() {
            var header = document.querySelector('.header-container');
            header.classList.toggle('mobile-open');
        }
    </script>
    <script src="portfolio.js"></script>
    <div class="header-container">
        <h1><span id="name1">&lt;/&gt;</span>Maged</h1>
        <div class="boxes">
            <a href="index.html" class="box1 nav-link">Home</a>
            <a href="home.html" class="box1 nav-link">Profile</a>
            <a href="projects.html" class="box1 nav-link">Projects</a>
            <a href="aboutme.html" class="box2 nav-link">About Me</a>
            <a href="contact.html" class="box3 nav-link">Contact</a>
            <a href="#" class="box4 nav-link"><i class="fas fa-shopping-cart"></i> coming soon</a>
        </div>
        <button class="hamburger" onclick="toggleNav()">
            <i class="fas fa-bars"></i>
        </button>
    </div> 

    <main class="contact-main">
        <h2 id="cn" class="animate-on-scroll">Contact</h2>
        <section class="contact-container animate-on-scroll">
            <form class="contact-me">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" maxlength="35" placeholder="example@gmail.com">

                <label for="firstname">First Name</label>
                <input type="text" name="firstname" id="firstname" placeholder="First name">

                <label for="lastname">Last Name</label>
                <input type="text" name="lastname" id="lastname" placeholder="Last name">

                <label for="message">Message</label>
                <textarea name="message" id="message" rows="4" placeholder="Write your message..."></textarea>

                <button type="submit" id="submit">Contact</button>
            </form>
        </section>
    </main>

    <div id="copyright">© 2026 DeVuRa. All rights reserved.</div>
</body>
</html>
